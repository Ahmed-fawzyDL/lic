<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<title>AH License</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f172a;color:#f1f5f9;font-family:Cairo,system-ui,sans-serif;padding:14px 14px 40px}
.card{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:16px;margin:0 auto 12px;max-width:520px}
.card h3{margin:0 0 10px;font-size:16px}
.card p{color:#94a3b8;font-size:13.5px;line-height:1.7;margin:4px 0 10px}
.hero{text-align:center}.big{font-size:46px}.hero h2{margin:4px 0}
input,textarea{width:100%;border-radius:12px;border:1px solid #475569;background:#0f172a;color:#f1f5f9;padding:11px 12px;font:inherit;margin:0 0 10px}
textarea{min-height:76px;font:12px ui-monospace,monospace;direction:ltr}
label{display:block;font-size:12.5px;color:#94a3b8;margin:4px 0 6px}
button{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer;color:#fff}
.pri,.gh,.wa,.red{width:100%;margin-top:8px}
.pri{background:#0f766e}.gh{background:#334155}.wa{background:#16a34a}.red{background:#b91c1c}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{background:#334155;padding:8px 14px;border-radius:20px;font-size:13px}
.chip.on{background:#0f766e}
.row{display:flex;align-items:center;gap:6px;padding:10px 0;border-top:1px solid #334155}
.row .g{flex:1;min-width:0}.row b{display:block}
.row small{display:block;color:#94a3b8;font-size:12px}
.mini{background:#334155;padding:8px 10px;font-size:14px}.dz{background:#7f1d1d}
.bad{color:#f87171!important}.warn{color:#fbbf24!important}
.ok{border-color:#0f766e}
.okb{margin-top:12px;border:1px dashed #0f766e;border-radius:14px;padding:12px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f1f5f9;color:#0f172a;padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ========== AH License · برنامج الرخص ========== */

/* التطبيقات: لو عملت تطبيق جديد ضيفه هنا */
const APPS={
  centric:['💰','Centric','https://centric-detech-solutions.pages.dev/'],
  dana:['🎒','Dana','https://dana-detech-solutions.pages.dev/']
};
/* السيرفر اللي بيستقبل أوامر الإيقاف */
const ADMIN='https://centric-detech-solutions.pages.dev';

const DUR=[[30,'شهر'],[90,'3 شهور'],[180,'6 شهور'],[365,'سنة'],[0,'دايمة']];
const KK='ahm-key',KL='ahm-list',te=new TextEncoder(),td=new TextDecoder();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=u=>{let s='';new Uint8Array(u).forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const dec=s=>{const b=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(b+'='.repeat((4-b.length%4)%4)),c=>c.charCodeAt(0))};
const fdt=t=>{const d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()};
let PRIV=null,PUBS='',tt;

function msg(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
function cp(t,m){navigator.clipboard.writeText(t).then(()=>msg(m||'اتنسخ ✓')).catch(()=>msg('مش قادر أنسخ'))}
const store=()=>{try{return JSON.parse(localStorage.getItem(KK)||'null')}catch(e){return null}};
const list=()=>{try{return JSON.parse(localStorage.getItem(KL)||'[]')}catch(e){return[]}};
const saveList=l=>localStorage.setItem(KL,JSON.stringify(l));
async function aesKey(pin,salt){const k=await crypto.subtle.importKey('raw',te.encode(pin),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function view(h){$('#app').innerHTML=h;scrollTo(0,0)}
function start(){if(!store())return vSetup();if(!PRIV)return vUnlock();vHome()}

/* ===== أول مرة: الرقم السري والمفتاح ===== */
function vSetup(){view(`<div class="card hero"><div class="big">🔑</div><h2>برنامج الرخص</h2>
<p>أول مرة: اعمل رقم سري يحمي مفتاح الرخص.<br><b style="color:#fbbf24">لو نسيته، مش هتقدر تعمل رخص جديدة بنفس المفتاح.</b></p>
<input id="p1" type="password" inputmode="numeric" placeholder="الرقم السري (6 أرقام على الأقل)">
<input id="p2" type="password" inputmode="numeric" placeholder="اكتبه تاني">
<button class="pri" onclick="setup()">🔑 اعمل المفتاح</button></div>
<div class="card"><p>عندك نسخة احتياطية من قبل؟</p><button class="gh" onclick="pickBk()">⬆️ استرجاع نسخة</button></div>`)}
async function setup(){
  const a=$('#p1').value,b=$('#p2').value;
  if(a.length<6)return msg('الرقم السري 6 أرقام على الأقل');
  if(a!==b)return msg('الرقمين مش زي بعض');
  const kp=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  const pj=await crypto.subtle.exportKey('jwk',kp.publicKey),sj=await crypto.subtle.exportKey('jwk',kp.privateKey);
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(a,salt),te.encode(JSON.stringify(sj)));
  const pub=btoa(JSON.stringify({kty:pj.kty,crv:pj.crv,x:pj.x,y:pj.y}));
  localStorage.setItem(KK,JSON.stringify({v:1,pub,salt:enc(salt),iv:enc(iv),ct:enc(ct)}));
  PRIV=kp.privateKey;PUBS=pub;vHome(true);
}

/* ===== الفتح بالرقم السري ===== */
function vUnlock(){view(`<div class="card hero"><div class="big">🔒</div><h2>برنامج الرخص</h2>
<input id="pin" type="password" inputmode="numeric" placeholder="الرقم السري" onkeydown="if(event.key==='Enter')unlock()">
<button class="pri" onclick="unlock()">🔓 فتح</button></div>`);setTimeout(()=>$('#pin').focus(),60)}
async function unlock(){
  const s=store();
  try{
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:dec(s.iv)},await aesKey($('#pin').value,dec(s.salt)),dec(s.ct));
    PRIV=await crypto.subtle.importKey('jwk',JSON.parse(td.decode(pt)),{name:'ECDSA',namedCurve:'P-256'},false,['sign']);
    PUBS=s.pub;vHome();
  }catch(e){msg('الرقم السري غلط');$('#pin').value=''}
}

/* ===== الشاشة الرئيسية ===== */
function vHome(first){
  const l=list().sort((a,b)=>b.at-a.at),now=Date.now();
  view(`${first?`<div class="card ok"><b>✅ المفتاح اتعمل</b><p>1) انسخ <b>المفتاح العام</b> من تحت وحطه في ملف الحارس<br>2) اعمل <b>نسخة احتياطية</b> واحفظها على Drive</p></div>`:''}

  <div class="card"><h3>➕ رخصة جديدة</h3>
  <input id="n" placeholder="اسم العميل">
  <input id="d" dir="ltr" placeholder="رقم الجهاز XXXX-XXXX" oninput="this.value=this.value.toUpperCase()">
  <label>التطبيق</label><div class="chips" id="ap">${Object.entries(APPS).map(([k,[i,n]],j)=>`<button class="chip ${j?'':'on'}" data-v="${k}" onclick="pick(this)">${i} ${n}</button>`).join('')}<button class="chip" data-v="*" onclick="pick(this)">⭐ كل التطبيقات</button></div>
  <label>المدة</label><div class="chips" id="du">${DUR.map(([v,l])=>`<button class="chip ${v===365?'on':''}" data-v="${v}" onclick="pick(this)">${l}</button>`).join('')}</div>
  <button class="pri" onclick="issue()">🔑 اعمل الرخصة</button><div id="out"></div></div>

  <div class="card"><h3>📋 الرخص (${l.length})</h3>${l.length?l.map(x=>{const ex=x.e&&now>x.e,left=x.e?Math.ceil((x.e-now)/864e5):0;
    return `<div class="row"><div class="g"><b>${esc(x.n||'—')}</b><small>${x.a==='*'?'⭐ كل التطبيقات':esc((APPS[x.a]||['',x.a])[1])} · <span dir="ltr">${x.d}</span>${x.rv?' · <span class="bad">⛔ متوقف</span>':''}</small><small class="${ex?'bad':left&&left<=7?'warn':''}">${x.e?(ex?'خلصت ':'لحد ')+fdt(x.e)+(ex?'':' · باقي '+left+' يوم'):'دايمة'}</small></div>
    <button class="mini" onclick="share('${x.id}')">💬</button><button class="mini" onclick="renew('${x.id}')">🔄</button><button class="mini" onclick="stopDev('${x.d}')">⛔</button><button class="mini dz" onclick="del('${x.id}')">🗑</button></div>`}).join(''):'<p>لسه مفيش رخص</p>'}</div>

  <div class="card"><h3>⛔ إيقاف جهاز</h3><p>الجهاز اللي توقفه، التطبيق بيتقفل عنده أول ما يتصل بالنت، حتى لو رخصته لسه شغالة.</p>
  <input id="rvd" dir="ltr" placeholder="رقم الجهاز XXXX-XXXX" oninput="this.value=this.value.toUpperCase()">
  <button class="red" onclick="adminAct('rv')">⛔ إيقاف</button><button class="gh" onclick="adminAct('ur')">✅ رجّعه يشتغل</button></div>

  <div class="card"><h3>🔐 المفتاح العام</h3><p>ده اللي بيتحط في ملف الحارس في كل تطبيق. مش سري.</p>
  <textarea readonly>${PUBS}</textarea><button class="gh" onclick="cp(PUBS,'اتنسخ المفتاح ✓')">📋 انسخ المفتاح العام</button></div>

  <div class="card"><h3>💾 النسخة الاحتياطية</h3><p>فيها المفتاح (متشفر بالرقم السري) وكل الرخص. احفظها على Drive، لأن لو الموبايل ضاع من غيرها مش هتقدر تعمل رخص بنفس المفتاح.</p>
  <button class="gh" onclick="bk()">⬇️ تنزيل نسخة</button><button class="gh" onclick="pickBk()">⬆️ استرجاع نسخة</button><button class="gh" onclick="PRIV=null;start()">🔒 اقفل</button></div>`);
}
function pick(b){b.parentElement.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b))}

/* ===== عمل الرخصة ===== */
async function sign(a,d,e,n){const p=enc(te.encode([a,d,e,n].join('|')));const s=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},PRIV,te.encode(p));return p+'.'+enc(s)}
async function issue(){
  const n=$('#n').value.trim().replace(/\|/g,' '),d=$('#d').value.trim().toUpperCase().replace(/\s/g,'');
  if(!n)return msg('اكتب اسم العميل');
  if(!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(d))return msg('رقم الجهاز شكله XXXX-XXXX');
  const a=$('#ap .on').dataset.v,days=+$('#du .on').dataset.v,e=days?Date.now()+days*864e5:0;
  const x={id:Date.now().toString(36),n,d,a,e,code:await sign(a,d,e,n),at:Date.now()};
  const l=list();l.push(x);saveList(l);vHome();
  $('#out').innerHTML=`<div class="okb"><b>✅ رخصة ${esc(n)}</b><textarea readonly>${x.code}</textarea><button class="gh" onclick="cp('${x.code}','اتنسخ الكود ✓')">📋 انسخ الكود</button><button class="wa" onclick="share('${x.id}')">💬 ابعتها على واتساب</button></div>`;
  $('#out').scrollIntoView({behavior:'smooth'});
}
const links=x=>(x.a==='*'?Object.keys(APPS):[x.a]).filter(k=>APPS[k]).map(k=>[APPS[k][1],APPS[k][2]+'?lic='+x.code]);
function share(id){
  const x=list().find(y=>y.id===id);if(!x)return;
  const t=`أهلاً ${x.n||''} 👋\nدي رخصة التفعيل${x.e?' لحد '+fdt(x.e):''}:\n\n`+links(x).map(([n,u])=>`${n}:\n${u}`).join('\n\n')+`\n\nافتح الرابط من نفس الموبايل والتطبيق هيتفعّل لوحده.\nعلى الآيفون: انسخ الرابط والصقه في شاشة التفعيل جوه التطبيق.`;
  open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
}
function renew(id){const x=list().find(y=>y.id===id);if(!x)return;$('#n').value=x.n;$('#d').value=x.d;const b=document.querySelector(`#ap .chip[data-v="${x.a}"]`);if(b)pick(b);scrollTo({top:0,behavior:'smooth'});msg('اختار المدة ودوس اعمل الرخصة')}
function del(id){if(!confirm('تشيلها من القايمة؟ (الرخصة نفسها هتفضل شغالة لحد ما تخلص أو توقفها)'))return;saveList(list().filter(x=>x.id!==id));vHome()}

/* ===== الإيقاف ===== */
function stopDev(d){$('#rvd').value=d;$('#rvd').scrollIntoView({behavior:'smooth',block:'center'});msg('دوس ⛔ إيقاف عشان توقفه')}
async function adminAct(act){
  const d=$('#rvd').value.trim().toUpperCase();
  if(!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(d))return msg('رقم الجهاز شكله XXXX-XXXX');
  if(act==='rv'&&!confirm('توقف الجهاز '+d+'؟'))return;
  const p=enc(te.encode([act,d,Date.now()].join('|'))),s=await crypto.subtle.sign({name:'ECDSA',hash:'SHA-256'},PRIV,te.encode(p));
  try{
    const r=await fetch(ADMIN+'/__lic/admin',{method:'POST',headers:{'content-type':'text/plain'},body:p+'.'+enc(s)});
    const j=await r.json();
    if(!j.ok)return msg('ما نفعش: '+(j.err||r.status));
    const l=list();l.forEach(x=>{if(x.d===d)x.rv=act==='rv'});saveList(l);vHome();
    msg(act==='rv'?'⛔ اتوقف':'✅ رجع يشتغل');
  }catch(e){msg('مفيش نت أو السيرفر مش بيرد')}
}

/* ===== النسخة الاحتياطية ===== */
function bk(){const b=new Blob([JSON.stringify({ahm:1,key:store(),list:list(),at:new Date().toISOString()})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ah-license-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();msg('اتنزلت ✓')}
function pickBk(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.ahm||!j.key)throw 0;if(store()&&!confirm('هتستبدل المفتاح والرخص اللي هنا. متأكد؟'))return;localStorage.setItem(KK,JSON.stringify(j.key));saveList(j.list||[]);PRIV=null;start();msg('اترجعت ✓ اكتب الرقم السري')}catch(e){msg('الملف ده مش نسخة رخص')}};r.readAsText(f)};i.click()}

start();
</script>
</body>
</html>
